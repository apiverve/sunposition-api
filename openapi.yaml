openapi: 3.0.4
info:
  title: Sun Position
  description: >-
    Sun Position calculates the sun altitude and azimuth, plus compass bearing,
    for any geographic coordinates and time. Provide latitude and longitude to
    read sun elevation angles and daylight status; paid plans add panel aiming
    angles and shadow ratios.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/sunposition:
    get:
      summary: Sun Position
      description: Get sun position data based on the location
      operationId: sunposition
      parameters:
        - name: lat
          in: query
          schema:
            type: number
          required: true
          description: The latitude of the location
          example: 37.7749
        - name: lon
          in: query
          schema:
            type: number
          required: true
          description: The longitude of the location
          example: -122.4194
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: The date to get the sun position data for (MM-DD-YYYY)
          example: 01-16-2026
        - name: time
          in: query
          schema:
            type: string
          required: false
          description: >-
            The time of day for the calculation (HH:mm format, 24-hour), read in
            the timezone of the coordinates. Defaults to 00:00 if not provided
          example: '14:30'
        - name: timezone
          in: query
          schema:
            type: string
          required: false
          description: >-
            IANA timezone to read the date and time in, such as
            America/Los_Angeles. Defaults to the timezone of the coordinates
          example: America/Los_Angeles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: 01-16-2026
                  time: '14:30'
                  timezone: America/Los_Angeles
                  timestampUTC: '2026-01-16T22:30:00.000Z'
                  coordinates:
                    latitude: 37.7749
                    longitude: -122.4194
                  sun:
                    altitude: 0.41616137328975444
                    azimuth: 0.5817558808515568
                    altitudeDegrees: 23.844
                    azimuthDegrees: 33.332
                    compassBearing: 213.332
                    isDaylight: true
                    declination: -20.7961
                    rightAscension: 19.9228
                    hourAngle: 2.174
                    distance: 0.983786
                  equationOfTime: -9.88
                  airMass: 2.454
                  clearSky:
                    directNormal: 702.4
                    globalHorizontal: 284.9
                  shadowRatio: 2.254
                  panelAim:
                    tilt: 66.07
                    azimuth: 213.44
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
